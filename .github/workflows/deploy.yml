name: deploy

# Каждый пуш в main: тесты и сборка панелей → копирование кода на сервер → docker compose up.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/backend.yml

  web:
    uses: ./.github/workflows/web.yml

  deploy:
    needs: [test, web]
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: /opt/super-market
      HTTP_PORT: "8090"
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          test -n "$SSH_KEY" || { echo "Нет секрета SSH_KEY"; exit 1; }
          test -n "$SSH_HOST" || { echo "Нет секрета SSH_HOST"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy code
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "mkdir -p $APP_DIR"
          rsync -az --delete \
            --exclude .git --exclude .env --exclude 'backend/bin' --exclude node_modules --exclude 'web/*/dist' \
            ./ "$SSH_USER@$SSH_HOST:$APP_DIR/"

      - name: Write .env
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          PROD_ENV: ${{ secrets.PROD_ENV }}
          # Ключ Firebase для push — отдельный секрет (base64 JSON сервисного аккаунта).
          FCM_CREDENTIALS: ${{ secrets.FCM_CREDENTIALS }}
          # Демо-аккаунт покупателя для проверки Apple / Google (номер:код), только приложение покупателя.
          REVIEW_LOGIN: ${{ secrets.REVIEW_LOGIN || '+998900000077:343549' }}
          # SMS с кодами входа (Eskiz): email кабинета и секретный ключ из «СМС шлюз». Пусто — только Telegram.
          ESKIZ_EMAIL: ${{ secrets.ESKIZ_EMAIL }}
          ESKIZ_PASSWORD: ${{ secrets.ESKIZ_PASSWORD }}
        run: |
          test -n "$PROD_ENV" || { echo "Нет секрета PROD_ENV"; exit 1; }
          {
            printf '%s\n' "$PROD_ENV"
            if [ -n "$FCM_CREDENTIALS" ]; then printf 'FCM_CREDENTIALS=%s\n' "$(printf '%s' "$FCM_CREDENTIALS" | tr -d '\n\r ')"; fi
            printf 'REVIEW_LOGIN=%s\n' "$REVIEW_LOGIN"
            if [ -n "$ESKIZ_EMAIL" ] && [ -n "$ESKIZ_PASSWORD" ]; then
              printf 'ESKIZ_EMAIL=%s\nESKIZ_PASSWORD=%s\n' "$(printf '%s' "$ESKIZ_EMAIL" | tr -d '\n\r ')" "$(printf '%s' "$ESKIZ_PASSWORD" | tr -d '\n\r ')"
            fi
          } | ssh "$SSH_USER@$SSH_HOST" "umask 077 && cat > $APP_DIR/.env"

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
        run: ssh "$SSH_USER@$SSH_HOST" "APP_DIR=$APP_DIR HTTP_PORT=$HTTP_PORT bash $APP_DIR/deploy/remote-deploy.sh"

      - name: Smoke test from outside
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          curl -fsS "http://$SSH_HOST:$HTTP_PORT/healthz"
          curl -fsS "http://$SSH_HOST:$HTTP_PORT/readyz"
