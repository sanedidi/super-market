name: apps

# Проверка Flutter-приложений: анализатор и тесты — только тех приложений, что изменились
# в коммите (изменения в apps/core проверяют все). Экономия минут Actions.
# Скриншоты экранов приложения покупателя (golden) — в артефакте client-screens.
# Проверочные APK и касса для Windows собираются ТОЛЬКО вручную:
# Actions → apps → Run workflow → «builds» = true. Сборки для Google Play (AAB) — workflow release.
on:
  push:
    branches: [main, "client-*"]
    paths: ["apps/**", ".github/workflows/apps.yml"]
  pull_request:
    paths: ["apps/**", ".github/workflows/apps.yml"]
  workflow_dispatch:
    inputs:
      builds:
        description: "Собрать APK (касса, курьер, магазин, дистрибьютор) и кассу для Windows"
        type: boolean
        default: false

concurrency:
  # Новый пуш отменяет незаконченную проверку того же ветки — не платим за устаревшие прогоны.
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  # Одна версия Flutter для всех сборок: apps/client/pubspec.lock требует Flutter >= 3.44
  # (Dart >= 3.12). Менять вместе с release.yml.
  FLUTTER_VERSION: "3.44.x"

jobs:
  # Какие приложения изменились. Ручной запуск проверяет все.
  changes:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.client == 'true' }}
      store: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.store == 'true' }}
      courier: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.courier == 'true' }}
      pos: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.pos == 'true' }}
      distributor: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.distributor == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            shared: &shared
              - "apps/core/**"
              - "apps/scripts/**"
              - ".github/workflows/apps.yml"
            client: [*shared, "apps/client/**"]
            store: [*shared, "apps/store/**"]
            courier: [*shared, "apps/courier/**"]
            pos: [*shared, "apps/pos/**"]
            # Дистрибьютор берёт экраны «Начала работы» и склада из apps/store.
            distributor: [*shared, "apps/store/**", "apps/distributor/**"]

  analyze:
    needs: changes
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.store == 'true' || needs.changes.outputs.courier == 'true' || needs.changes.outputs.pos == 'true' || needs.changes.outputs.distributor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Versions
        run: flutter --version
      - name: Client
        if: needs.changes.outputs.client == 'true'
        working-directory: apps/client
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Client tests and screens
        # Проверять все приложения, даже если предыдущее упало: все ошибки — за один прогон.
        if: ${{ !cancelled() && needs.changes.outputs.client == 'true' }}
        working-directory: apps/client
        run: flutter test --update-goldens
      - uses: actions/upload-artifact@v4
        if: ${{ always() && needs.changes.outputs.client == 'true' }}
        with:
          name: client-screens
          path: apps/client/test/screens/*.png
          if-no-files-found: ignore
      - name: Courier
        if: ${{ !cancelled() && needs.changes.outputs.courier == 'true' }}
        working-directory: apps/courier
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Store
        if: ${{ !cancelled() && needs.changes.outputs.store == 'true' }}
        working-directory: apps/store
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: POS
        if: ${{ !cancelled() && needs.changes.outputs.pos == 'true' }}
        working-directory: apps/pos
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Distributor
        if: ${{ !cancelled() && needs.changes.outputs.distributor == 'true' }}
        working-directory: apps/distributor
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

  # Касса для Windows: архив с SuperMarketPOS.exe — в артефакте pos-windows.
  pos-windows:
    needs: analyze
    if: github.event_name == 'workflow_dispatch' && inputs.builds
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: apps/pos
        shell: bash
        run: |
          # Папки платформ пока создаются в CI (не перезаписывает lib/).
          flutter create --platforms=windows --org uz.supermarket --project-name sm_pos .
          rm -f test/widget_test.dart
          bash branding/apply.sh
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: pos-windows
          path: apps/pos/build/windows/x64/runner/Release/

  # Касса для Android: APK — в артефакте pos-android.
  pos-android:
    needs: analyze
    if: github.event_name == 'workflow_dispatch' && inputs.builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: apps/pos
        run: |
          flutter create --platforms=android --org uz.supermarket --project-name sm_pos .
          rm -f test/widget_test.dart
          bash branding/apply.sh
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pos-android
          path: apps/pos/build/app/outputs/flutter-apk/app-release.apk

  # Приложение курьера для Android: APK — в артефакте courier-android.
  courier-android:
    needs: analyze
    if: github.event_name == 'workflow_dispatch' && inputs.builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: apps/courier
        run: |
          flutter create --platforms=android --org uz.supermarket --project-name sm_courier .
          rm -f test/widget_test.dart
          bash branding/apply.sh
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: courier-android
          path: apps/courier/build/app/outputs/flutter-apk/app-release.apk

  # Приложение магазина для Android: APK — в артефакте store-android.
  store-android:
    needs: analyze
    if: github.event_name == 'workflow_dispatch' && inputs.builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: apps/store
        run: |
          flutter create --platforms=android --org uz.supermarket --project-name sm_store .
          rm -f test/widget_test.dart
          bash branding/apply.sh
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: store-android
          path: apps/store/build/app/outputs/flutter-apk/app-release.apk

  # Приложение дистрибьютора для Android: APK — в артефакте distributor-android.
  distributor-android:
    needs: analyze
    if: github.event_name == 'workflow_dispatch' && inputs.builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: apps/distributor
        run: |
          flutter create --platforms=android --org uz.supermarket --project-name sm_distributor .
          rm -f test/widget_test.dart
          bash branding/apply.sh
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: distributor-android
          path: apps/distributor/build/app/outputs/flutter-apk/app-release.apk
