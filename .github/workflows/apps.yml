name: apps

# Проверка Flutter-приложений: анализатор и тесты — только тех приложений, что изменились
# в коммите (изменения в apps/core проверяют все). Экономия минут Actions.
# Скриншоты экранов приложения покупателя (golden) — в артефакте client-screens.
#
# Сборки (APK и касса для Windows) — только по запросу, по умолчанию ничего не собирается:
#   • при пуше — метка в сообщении коммита:
#       [build: windows]                 касса для Windows
#       [build: windows, store]          несколько через запятую
#       [build: android]                 все APK (касса, магазин, курьер, дистрибьютор, сотрудник)
#       [build: all]                     всё
#     Имена: windows, pos-android, store, courier, distributor, employee, android, all, none.
#     Метка работает в любом коммите пуша, даже если приложения не менялись.
#   • вручную — Actions → apps → Run workflow → «Что собрать».
# Сборки для Google Play (AAB) — workflow release.
on:
  push:
    branches: [main, "client-*"]
  pull_request:
    paths: ["apps/**", ".github/workflows/apps.yml"]
  workflow_dispatch:
    inputs:
      build:
        description: "Что собрать"
        type: choice
        default: none
        options:
          - none
          - windows
          - pos-android
          - store
          - courier
          - distributor
          - employee
          - android
          - all

concurrency:
  # Новый пуш отменяет незаконченную проверку той же ветки — не платим за устаревшие прогоны.
  # Прогон со сборкой — в своей группе: его не отменяет следующий пуш.
  group: apps-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits.*.message), '[build')) && github.run_id || 'check' }}
  cancel-in-progress: true

env:
  # Одна версия Flutter для всех сборок: apps/client/pubspec.lock требует Flutter >= 3.44
  # (Dart >= 3.12). Менять вместе с release.yml.
  FLUTTER_VERSION: "3.44.x"

jobs:
  # Одно короткое задание (экономия минут): что собирать — метка [build: …] в сообщениях
  # коммитов пуша или выбор при ручном запуске; какие приложения проверять — при пуше то,
  # что изменилось, при ручном запуске то, что собирается («none» — проверить все).
  changes:
    runs-on: ubuntu-latest
    # В pull request paths-filter берёт список файлов через GitHub API — без
    # pull-requests: read падает «Resource not accessible by integration».
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows: ${{ steps.p.outputs.windows }}
      pos-android: ${{ steps.p.outputs.pos-android }}
      build-store: ${{ steps.p.outputs.store }}
      build-courier: ${{ steps.p.outputs.courier }}
      build-distributor: ${{ steps.p.outputs.distributor }}
      build-employee: ${{ steps.p.outputs.employee }}
      client: ${{ github.event_name == 'workflow_dispatch' && inputs.build == 'none' || steps.f.outputs.client == 'true' }}
      store: ${{ github.event_name == 'workflow_dispatch' && (inputs.build == 'none' || steps.p.outputs.store == 'true') || steps.f.outputs.store == 'true' }}
      courier: ${{ github.event_name == 'workflow_dispatch' && (inputs.build == 'none' || steps.p.outputs.courier == 'true') || steps.f.outputs.courier == 'true' }}
      pos: ${{ github.event_name == 'workflow_dispatch' && (inputs.build == 'none' || steps.p.outputs.windows == 'true' || steps.p.outputs.pos-android == 'true') || steps.f.outputs.pos == 'true' }}
      distributor: ${{ github.event_name == 'workflow_dispatch' && (inputs.build == 'none' || steps.p.outputs.distributor == 'true') || steps.f.outputs.distributor == 'true' }}
      employee: ${{ github.event_name == 'workflow_dispatch' && (inputs.build == 'none' || steps.p.outputs.employee == 'true') || steps.f.outputs.employee == 'true' }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ inputs.build }}
          MESSAGES: ${{ toJSON(github.event.commits.*.message) }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            want="$CHOICE"
          elif [ "$EVENT" = "push" ]; then
            want=$(printf '%s' "$MESSAGES" | grep -ioE '\[build:?[^]]*\]' | sed -E 's/^\[build:?//I; s/\]$//' | tr 'A-Z,' 'a-z ' | tr '\n' ' ' || true)
          else
            want=""
          fi
          windows=false; posa=false; store=false; courier=false; distributor=false; employee=false
          for w in $want; do
            case "$w" in
              windows|win|pos-windows) windows=true ;;
              pos-android) posa=true ;;
              store) store=true ;;
              courier) courier=true ;;
              distributor) distributor=true ;;
              employee) employee=true ;;
              android|apk) posa=true; store=true; courier=true; distributor=true; employee=true ;;
              all) windows=true; posa=true; store=true; courier=true; distributor=true; employee=true ;;
              none|"") ;;
              *) echo "::warning title=Неизвестная сборка::«$w» — допустимо: windows, pos-android, store, courier, distributor, employee, android, all, none" ;;
            esac
          done
          {
            echo "windows=$windows"
            echo "pos-android=$posa"
            echo "store=$store"
            echo "courier=$courier"
            echo "distributor=$distributor"
            echo "employee=$employee"
          } >> "$GITHUB_OUTPUT"
          echo "### Сборки: windows=$windows, pos-android=$posa, store=$store, courier=$courier, distributor=$distributor, employee=$employee" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: f
        with:
          # Правка этого файла не перепроверяет все приложения — экономия минут.
          filters: |
            shared: &shared
              - "apps/core/**"
              - "apps/scripts/**"
            client: [*shared, "apps/client/**"]
            store: [*shared, "apps/store/**"]
            courier: [*shared, "apps/courier/**"]
            pos: [*shared, "apps/pos/**"]
            # Дистрибьютор берёт экраны «Начала работы» и склада из apps/store.
            distributor: [*shared, "apps/store/**", "apps/distributor/**"]
            # «SM Сотрудник» берёт кассу, приход, вход и сканер из apps/store.
            employee: [*shared, "apps/store/**", "apps/employee/**"]

  analyze:
    needs: changes
    if: needs.changes.outputs.client == 'true' || needs.changes.outputs.store == 'true' || needs.changes.outputs.courier == 'true' || needs.changes.outputs.pos == 'true' || needs.changes.outputs.distributor == 'true' || needs.changes.outputs.employee == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Versions
        run: flutter --version
      - name: Client
        if: needs.changes.outputs.client == 'true'
        working-directory: apps/client
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Client tests and screens
        # Проверять все приложения, даже если предыдущее упало: все ошибки — за один прогон.
        if: ${{ !cancelled() && needs.changes.outputs.client == 'true' }}
        working-directory: apps/client
        run: flutter test --update-goldens
      - uses: actions/upload-artifact@v4
        if: ${{ always() && needs.changes.outputs.client == 'true' }}
        with:
          name: client-screens
          # Хранить неделю: место под артефакты на тарифе Free — 500 МБ.
          retention-days: 7
          path: apps/client/test/screens/*.png
          if-no-files-found: ignore
      - name: Courier
        if: ${{ !cancelled() && needs.changes.outputs.courier == 'true' }}
        working-directory: apps/courier
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Store
        if: ${{ !cancelled() && needs.changes.outputs.store == 'true' }}
        working-directory: apps/store
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: POS
        if: ${{ !cancelled() && needs.changes.outputs.pos == 'true' }}
        working-directory: apps/pos
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Distributor
        if: ${{ !cancelled() && needs.changes.outputs.distributor == 'true' }}
        working-directory: apps/distributor
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Employee
        if: ${{ !cancelled() && needs.changes.outputs.employee == 'true' }}
        working-directory: apps/employee
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

  # Касса для Windows: архив с SuperMarketPOS.exe — в артефакте pos-windows.
  pos-windows:
    needs: [changes, analyze]
    # Сборка идёт, даже если проверка пропущена (приложение не менялось), но не после её ошибки.
    if: ${{ !cancelled() && needs.changes.outputs.windows == 'true' && needs.analyze.result != 'failure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: apps/pos
        shell: bash
        run: |
          # Папки платформ пока создаются в CI (не перезаписывает lib/).
          flutter create --platforms=windows --org uz.supermarket --project-name sm_pos .
          rm -f test/widget_test.dart
          bash branding/apply.sh
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: pos-windows
          # Хранить неделю: место под артефакты на тарифе Free — 500 МБ.
          retention-days: 7
          path: apps/pos/build/windows/x64/runner/Release/

  # Касса для Android: APK — в артефакте pos-android.
  pos-android:
    needs: [changes, analyze]
    # Сборка идёт, даже если проверка пропущена (приложение не менялось), но не после её ошибки.
    if: ${{ !cancelled() && needs.changes.outputs.pos-android == 'true' && needs.analyze.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: apps/pos
        run: |
          flutter create --platforms=android --org uz.supermarket --project-name sm_pos .
          rm -f test/widget_test.dart
          bash branding/apply.sh
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pos-android
          # Хранить неделю: место под артефакты на тарифе Free — 500 МБ.
          retention-days: 7
          path: apps/pos/build/app/outputs/flutter-apk/app-release.apk

  # Приложение курьера для Android: APK — в артефакте courier-android.
  courier-android:
    needs: [changes, analyze]
    # Сборка идёт, даже если проверка пропущена (приложение не менялось), но не после её ошибки.
    if: ${{ !cancelled() && needs.changes.outputs.build-courier == 'true' && needs.analyze.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: apps/courier
        run: |
          flutter create --platforms=android --org uz.supermarket --project-name sm_courier .
          rm -f test/widget_test.dart
          bash branding/apply.sh
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: courier-android
          # Хранить неделю: место под артефакты на тарифе Free — 500 МБ.
          retention-days: 7
          path: apps/courier/build/app/outputs/flutter-apk/app-release.apk

  # Приложение магазина для Android: APK — в артефакте store-android.
  store-android:
    needs: [changes, analyze]
    # Сборка идёт, даже если проверка пропущена (приложение не менялось), но не после её ошибки.
    if: ${{ !cancelled() && needs.changes.outputs.build-store == 'true' && needs.analyze.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: apps/store
        run: |
          flutter create --platforms=android --org uz.supermarket --project-name sm_store .
          rm -f test/widget_test.dart
          bash branding/apply.sh
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: store-android
          # Хранить неделю: место под артефакты на тарифе Free — 500 МБ.
          retention-days: 7
          path: apps/store/build/app/outputs/flutter-apk/app-release.apk

  # Приложение дистрибьютора для Android: APK — в артефакте distributor-android.
  distributor-android:
    needs: [changes, analyze]
    # Сборка идёт, даже если проверка пропущена (приложение не менялось), но не после её ошибки.
    if: ${{ !cancelled() && needs.changes.outputs.build-distributor == 'true' && needs.analyze.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: apps/distributor
        run: |
          flutter create --platforms=android --org uz.supermarket --project-name sm_distributor .
          rm -f test/widget_test.dart
          bash branding/apply.sh
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: distributor-android
          # Хранить неделю: место под артефакты на тарифе Free — 500 МБ.
          retention-days: 7
          path: apps/distributor/build/app/outputs/flutter-apk/app-release.apk

  # «SM Сотрудник» для Android: APK — в артефакте employee-android.
  employee-android:
    needs: [changes, analyze]
    # Сборка идёт, даже если проверка пропущена (приложение не менялось), но не после её ошибки.
    if: ${{ !cancelled() && needs.changes.outputs.build-employee == 'true' && needs.analyze.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: apps/employee
        run: |
          flutter create --platforms=android --org uz.supermarket --project-name sm_employee .
          rm -f test/widget_test.dart
          bash branding/apply.sh
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: employee-android
          # Хранить неделю: место под артефакты на тарифе Free — 500 МБ.
          retention-days: 7
          path: apps/employee/build/app/outputs/flutter-apk/app-release.apk
