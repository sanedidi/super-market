name: apps

# Проверка Flutter-приложений: анализатор и тесты. Скриншоты экранов
# приложения покупателя (golden) — в артефакте client-screens.
# Сборки кассы: pos-windows (sm_pos.exe) и pos-android (APK).
# Приложение курьера для Android: courier-android (APK).
# Это проверочные APK (подпись debug-ключом). Сборки для Google Play (AAB) — workflow release.
on:
  push:
    branches: [main, "client-*"]
    paths: ["apps/**", ".github/workflows/apps.yml"]
  pull_request:
    paths: ["apps/**", ".github/workflows/apps.yml"]
  workflow_dispatch:

env:
  # Одна версия Flutter для всех сборок: apps/client/pubspec.lock требует Flutter >= 3.44
  # (Dart >= 3.12). Менять вместе с release.yml.
  FLUTTER_VERSION: "3.44.x"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Versions
        run: flutter --version
      - name: Client
        working-directory: apps/client
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Client tests and screens
        # Проверять все приложения, даже если предыдущее упало: все ошибки — за один прогон.
        if: ${{ !cancelled() }}
        working-directory: apps/client
        run: flutter test --update-goldens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-screens
          path: apps/client/test/screens/*.png
          if-no-files-found: ignore
      - name: Courier
        if: ${{ !cancelled() }}
        working-directory: apps/courier
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Store
        if: ${{ !cancelled() }}
        working-directory: apps/store
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: POS
        if: ${{ !cancelled() }}
        working-directory: apps/pos
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

  # Касса для Windows: архив с SuperMarketPOS.exe — в артефакте pos-windows.
  pos-windows:
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: apps/pos
        shell: bash
        run: |
          # Папки платформ пока создаются в CI (не перезаписывает lib/).
          flutter create --platforms=windows --org uz.supermarket --project-name sm_pos .
          rm -f test/widget_test.dart
          bash branding/apply.sh
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: pos-windows
          path: apps/pos/build/windows/x64/runner/Release/

  # Касса для Android: APK — в артефакте pos-android.
  pos-android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: apps/pos
        run: |
          flutter create --platforms=android --org uz.supermarket --project-name sm_pos .
          rm -f test/widget_test.dart
          bash branding/apply.sh
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pos-android
          path: apps/pos/build/app/outputs/flutter-apk/app-release.apk

  # Приложение курьера для Android: APK — в артефакте courier-android.
  courier-android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: apps/courier
        run: |
          flutter create --platforms=android --org uz.supermarket --project-name sm_courier .
          rm -f test/widget_test.dart
          bash branding/apply.sh
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: courier-android
          path: apps/courier/build/app/outputs/flutter-apk/app-release.apk
