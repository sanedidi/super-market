name: demo-data

# Демо-данные на сервере: seed — загрузить (сети, магазины, товары, остатки,
# продажи, акции, баннеры), review — демо-доступ для проверки в App Store /
# Google Play (нужны REVIEW_LOGIN в .env и загруженный seed; данные для
# заметок проверяющему — в логе шага Run), clean — удалить всё, что
# загрузили seed и review.
# Запускается вручную: Actions → demo-data → Run workflow.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "seed — загрузить, review — доступ для App Store / Google Play, clean — удалить"
        type: choice
        options: [seed, review, clean]
        default: seed
      owner_phone:
        description: "Только для seed: телефон владельца Baraka Market (пусто — первый из SUPER_ADMIN_PHONES)"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: /opt/super-market
    steps:
      - name: Check input
        env:
          OWNER_PHONE: ${{ inputs.owner_phone }}
        run: |
          if [ -n "$OWNER_PHONE" ] && ! [[ "$OWNER_PHONE" =~ ^\+?[0-9]{9,15}$ ]]; then
            echo "Телефон в формате +998901234567"; exit 1
          fi

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          ACTION: ${{ inputs.action }}
          OWNER_PHONE: ${{ inputs.owner_phone }}
        run: |
          # Телефон владельца нужен только seed.
          ARGS="$ACTION"
          if [ "$ACTION" = "seed" ] && [ -n "$OWNER_PHONE" ]; then ARGS="$ACTION $OWNER_PHONE"; fi
          ssh "$SSH_USER@$SSH_HOST" "cd $APP_DIR && docker compose -f deploy/docker-compose.prod.yml --env-file .env run --rm --no-deps -T api demo $ARGS"
