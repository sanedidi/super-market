name: demo-data

# Демо-данные на сервере: seed — загрузить (сети, магазины, товары, остатки,
# продажи, акции, баннеры), clean — удалить всё, что загрузил seed.
# Запускается вручную: Actions → demo-data → Run workflow.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "seed — загрузить, clean — удалить"
        type: choice
        options: [seed, clean]
        default: seed
      owner_phone:
        description: "Телефон владельца Baraka Market (пусто — первый из SUPER_ADMIN_PHONES)"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: /opt/super-market
    steps:
      - name: Check input
        env:
          OWNER_PHONE: ${{ inputs.owner_phone }}
        run: |
          if [ -n "$OWNER_PHONE" ] && ! [[ "$OWNER_PHONE" =~ ^\+?[0-9]{9,15}$ ]]; then
            echo "Телефон в формате +998901234567"; exit 1
          fi

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          ACTION: ${{ inputs.action }}
          OWNER_PHONE: ${{ inputs.owner_phone }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "cd $APP_DIR && docker compose -f deploy/docker-compose.prod.yml --env-file .env run --rm --no-deps -T api demo $ACTION $OWNER_PHONE"
