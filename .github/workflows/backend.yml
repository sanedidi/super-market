name: backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U market"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://market:market@localhost:5432/market_test?sslmode=disable
      DATABASE_URL: postgres://market:market@localhost:5432/market_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go mod verify
        run: go mod verify

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: tests
        run: go test -race -count=1 ./...

      - name: migrations on real PostGIS
        run: go run ./cmd/migrate

      - name: build
        run: go build ./...

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t super-market-backend:ci backend
