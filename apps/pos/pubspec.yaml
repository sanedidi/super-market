name: sm_pos
description: Касса Super Market для Windows и Android. Продаёт без интернета, чеки досылаются сами.
publish_to: none
version: 0.4.6+11

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sm_core:
    path: ../core
  provider: ^6.1.2
  http: ^1.2.2
  crypto: ^3.0.6
  uuid: ^4.5.1
  path_provider: ^2.1.4
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  # Шрифты встроены: на кассах с Windows 7/10 без интернета выглядит одинаково.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_800ExtraBold.ttf
          weight: 800
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans_900Black.ttf
          weight: 900
