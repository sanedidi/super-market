name: sm_client
description: Приложение покупателя Super Market — заказ продуктов из магазинов рядом с доставкой.
publish_to: none
version: 0.7.1+9

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sm_core:
    path: ../core
  provider: ^6.1.2
  url_launcher: ^6.3.0
  geolocator: ^13.0.1
  yandex_mapkit: ^4.1.0
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.2
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  http: ^1.2.2
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Иконка приложения: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#E11D2A"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png

# Нативный splash (пока грузится Flutter): dart run flutter_native_splash:create
flutter_native_splash:
  color: "#E11D2A"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#E11D2A"
    image: assets/branding/splash_logo.png
