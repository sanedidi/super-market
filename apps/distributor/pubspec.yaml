name: sm_distributor
description: Super Market Агент — магазины и чего им не хватает, заказы от магазинов, склад (приход, расход, инвентаризация, списание), ввод товаров как в «SM Магазин».
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sm_core:
    path: ../core
  # Экраны «Начала работы», вход, код-замок, склад — из приложения магазина:
  # дистрибьютор вводит товары точно так же, как магазин.
  sm_store:
    path: ../store
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  mobile_scanner: ^7.0.0
  url_launcher: ^6.3.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  qr_flutter: ^4.1.0
  # Логотип бренда в заявке на новый бренд.
  image_picker: ^1.1.2
  # Пуши: Firebase своего приложения (firebase_messaging приходит из sm_store).
  firebase_core: ^4.0.0

# Как в apps/store: latlong2 и flutter_localizations должны сойтись на intl из Flutter SDK.
dependency_overrides:
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
