name: sm_store
description: Super Market Магазин — первая настройка магазина, начало работы (фото полок, штрихкоды), приход по фото накладной, склад, заказы и финансы магазина.
publish_to: none
version: 0.9.5+29

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sm_core:
    path: ../core
  provider: ^6.1.2
  http: ^1.2.2
  image_picker: ^1.1.2
  mobile_scanner: ^7.0.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  local_auth: ^3.0.0
  crypto: ^3.0.6
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  # Шахзод: голосовое — удерживать микрофон (WAV 16 кГц во временный файл).
  record: ^6.0.0
  path_provider: ^2.1.4

# latlong2 (карта в первой настройке) и flutter_localizations должны
# сойтись на одной версии intl — берём ту, что закреплена во Flutter SDK.
dependency_overrides:
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
