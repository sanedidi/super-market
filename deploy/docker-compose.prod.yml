# Продакшен на сервере. Запускается из GitHub Actions (deploy.yml):
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# Наружу открыт только nginx (панели и API; порт HTTP_PORT, по умолчанию 8090 —
# порт 80 на сервере занят другим приложением). База, Redis и MinIO доступны
# только внутри docker-сети.
name: super-market

x-backend-env: &backend-env
  APP_ENV: prod
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET обязателен}
  SUPER_ADMIN_PHONES: ${SUPER_ADMIN_PHONES:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
  PAYME_KEY: ${PAYME_KEY:-}
  PAYME_TEST: ${PAYME_TEST:-false}
  CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
  CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
  CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
  PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-}
  PAYMENT_TIMEOUT: ${PAYMENT_TIMEOUT:-15m}
  ACCEPT_TIMEOUT: ${ACCEPT_TIMEOUT:-10m}

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER обязателен}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB обязателен}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    logging: *logging

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER обязателен}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD обязателен}
    volumes:
      - minio-data:/data
    restart: unless-stopped
    logging: *logging

  migrate:
    build: ../backend
    command: ["migrate"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  api:
    build: ../backend
    command: ["api"]
    environment:
      <<: *backend-env
      HTTP_ADDR: ":8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    logging: *logging

  worker:
    build: ../backend
    command: ["worker"]
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  nginx:
    build: ../web
    ports:
      - "${HTTP_PORT:-8090}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

volumes:
  db-data:
  redis-data:
  minio-data:
