# Панели (статические файлы) и прокси к API. HTTPS добавим, когда будет домен.
#   /         — панель магазина
#   /admin/   — панель супер-админа
#   /api/     — API (в т.ч. обработчики Payme и Click)
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        # WebSocket (понадобится для живых заказов).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://api:8080;
    }

    # Файлы сборки с хэшем в имени — кэшируются навсегда.
    location ~ ^/(admin/)?assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /admin/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
