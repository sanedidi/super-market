# Панели (статические файлы) и прокси к API. HTTPS добавим, когда будет домен.
#   /         — панель магазина
#   /admin/   — панель супер-админа
#   /api/     — API (в т.ч. обработчики Payme и Click)
#   /privacy, /privacy/uz, /courier-terms, /delete-account, /site/ — статические страницы (web/site)
#   /landing, /landing/uz — лендинг; снаружи это «/» и «/uz» домена super-market.uz
#                           (их проксирует хост-nginx, см. deploy/host-nginx.conf)
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    # Адрес api ищем через DNS Docker при каждом запросе (раз в 10 с), а не
    # один раз при старте: после пересоздания контейнера api меняется его IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # WebSocket (понадобится для живых заказов).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass $api_upstream;
    }

    # Файлы сборки с хэшем в имени — кэшируются навсегда.
    location ~ ^/(admin/)?assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Лендинг (web/site/index.html, uz.html). Внутренние адреса только для
    # хост-nginx: он отдаёт их на «/» и «/uz» домена super-market.uz. «/» здесь
    # по-прежнему панель магазина (store.super-market.uz).
    location = /landing {
        add_header Cache-Control "no-cache";
        charset utf-8;
        try_files /site/index.html =404;
    }
    location = /landing/uz {
        add_header Cache-Control "no-cache";
        charset utf-8;
        try_files /site/uz.html =404;
    }

    # Публичные страницы сайта (web/site): политика, условия курьеров,
    # удаление аккаунта. Точные адреса — чтобы не задеть SPA-фолбэк ниже.
    location = /privacy {
        add_header Cache-Control "no-cache";
        charset utf-8;
        try_files /site/privacy.html =404;
    }
    location = /privacy/uz {
        add_header Cache-Control "no-cache";
        charset utf-8;
        try_files /site/privacy-uz.html =404;
    }
    location = /courier-terms {
        add_header Cache-Control "no-cache";
        charset utf-8;
        try_files /site/courier-terms.html =404;
    }
    location = /delete-account {
        add_header Cache-Control "no-cache";
        charset utf-8;
        try_files /site/delete-account.html =404;
    }
    # /privacy/ → /privacy и т.п. (относительный Location: за внешним HTTPS-прокси).
    location ~ ^/(privacy|privacy/uz|courier-terms|delete-account)/$ {
        absolute_redirect off;
        return 301 /$1;
    }
    # CSS/JS/картинки страниц, robots.txt и sitemap.xml. ^~ — чтобы regex-локации
    # выше не перехватили. Имена файлов без хэша, поэтому CSS/JS/HTML — no-cache
    # (браузер переспрашивает по ETag и получает 304), картинки — на неделю.
    location ^~ /site/ {
        add_header Cache-Control "no-cache";
        charset utf-8;
        charset_types text/css application/javascript text/javascript text/plain application/xml;
        try_files $uri =404;

        location ~* \.(?:webp|png|jpe?g|gif|ico|woff2?)$ {
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }
    }

    location /admin/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
