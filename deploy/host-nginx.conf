# Nginx на самом сервере (не в Docker): домены super-market.uz → наш стек
# на 127.0.0.1:8090. Ставится скриптом deploy/remote-deploy.sh в
# /etc/nginx/sites-available/super-market.conf. Сертификаты Let's Encrypt
# уже выпущены certbot (плагин nginx) и продлеваются им сами.
#
#   store.super-market.uz — панель магазина (и API по /api/)
#   super-market.uz       — / — лендинг на узбекском (по умолчанию), /ru — на русском,
#                           /uz — 301 на /; /api/ (Payme, Click и старые ссылки) как
#                           раньше; /privacy, /courier-terms, /delete-account, /offer,
#                           /offer/stores (UZ) и они же с /ru (RU), /site/, /robots.txt,
#                           /sitemap.xml — публичные страницы (web/site),
#                           остальное — перенаправление на store.super-market.uz
#   www.super-market.uz   — /api/ как на основном домене, остальное — 301 на super-market.uz
#   api.super-market.uz   — API для приложений
#   admin.super-market.uz — панель супер-админа
#   tg.super-market.uz    — пока перенаправление на store.super-market.uz

upstream super_market {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name store.super-market.uz;
    ssl_certificate /etc/letsencrypt/live/store.super-market.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.super-market.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 20m;

    location / {
        proxy_pass http://super_market;
        include /etc/nginx/snippets/super-market-proxy.conf;
    }
}

# Основной домен: лендинг и документы. Панель — на store.super-market.uz. API
# оставляем — на него могут смотреть Payme/Click (POST нельзя перенаправлять).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name super-market.uz;
    ssl_certificate /etc/letsencrypt/live/super-market.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/super-market.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://super_market;
        include /etc/nginx/snippets/super-market-proxy.conf;
    }
    # Лендинг: в стеке он лежит на /landing (UZ) и /landing/ru (RU), потому что «/»
    # там — панель магазина. В точной (=) локации proxy_pass с URI заменяет весь путь:
    # «/» → «/landing», «/ru» → «/landing/ru»; ?utm=… передаётся как есть.
    location = / {
        proxy_pass http://super_market/landing;
        include /etc/nginx/snippets/super-market-proxy.conf;
    }
    location = /ru {
        proxy_pass http://super_market/landing/ru;
        include /etc/nginx/snippets/super-market-proxy.conf;
    }
    location = /ru/ {
        return 301 /ru$is_args$args;
    }
    # Узбекский теперь по умолчанию: старый адрес /uz ведёт на «/» (ссылки и закладки не ломаются).
    location = /uz {
        return 301 /$is_args$args;
    }
    location = /uz/ {
        return 301 /$is_args$args;
    }
    location = /index.html {
        return 301 /;
    }
    # Для поисковиков: файлы лежат в web/site.
    location = /robots.txt {
        proxy_pass http://super_market/site/robots.txt;
        include /etc/nginx/snippets/super-market-proxy.conf;
    }
    location = /sitemap.xml {
        proxy_pass http://super_market/site/sitemap.xml;
        include /etc/nginx/snippets/super-market-proxy.conf;
    }
    # Публичные страницы (ссылки из App Store / Google Play и приложений):
    # политика, условия курьеров, удаление аккаунта, оферты и их CSS/JS в /site/.
    # Без суффикса — узбекский, /ru — русский; старые /…/uz стек перенаправляет 301 на адрес
    # без суффикса.
    location ~ ^/(privacy|courier-terms|delete-account|offer|offer/stores)(/ru|/uz)?/?$ {
        proxy_pass http://super_market;
        include /etc/nginx/snippets/super-market-proxy.conf;
    }
    location ^~ /site/ {
        proxy_pass http://super_market;
        include /etc/nginx/snippets/super-market-proxy.conf;
    }
    # Остальное (старые ссылки на панель) — в панель магазина. 302: адреса
    # ещё могут понадобиться сайту.
    location / {
        return 302 https://store.super-market.uz$request_uri;
    }
}

# www → основной домен (один адрес для поисковиков). API оставляем как есть:
# POST-запросы Payme/Click нельзя перенаправлять. Сертификат тот же, что был
# у общего блока super-market.uz + www.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.super-market.uz;
    ssl_certificate /etc/letsencrypt/live/super-market.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/super-market.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://super_market;
        include /etc/nginx/snippets/super-market-proxy.conf;
    }
    location / {
        return 301 https://super-market.uz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.super-market.uz;
    ssl_certificate /etc/letsencrypt/live/api.super-market.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.super-market.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 20m;

    location = / {
        return 302 https://store.super-market.uz/;
    }
    location / {
        proxy_pass http://super_market;
        include /etc/nginx/snippets/super-market-proxy.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.super-market.uz;
    ssl_certificate /etc/letsencrypt/live/admin.super-market.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.super-market.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 20m;

    location = / {
        return 302 /admin/;
    }
    location / {
        proxy_pass http://super_market;
        include /etc/nginx/snippets/super-market-proxy.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tg.super-market.uz;
    ssl_certificate /etc/letsencrypt/live/tg.super-market.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tg.super-market.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://store.super-market.uz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name super-market.uz www.super-market.uz store.super-market.uz api.super-market.uz admin.super-market.uz tg.super-market.uz;
    return 301 https://$host$request_uri;
}
