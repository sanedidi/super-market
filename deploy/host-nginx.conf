# Nginx на самом сервере (не в Docker): домены super-market.uz → наш стек
# на 127.0.0.1:8090. Ставится скриптом deploy/remote-deploy.sh в
# /etc/nginx/sites-available/super-market.conf. Сертификаты Let's Encrypt
# уже выпущены certbot (плагин nginx) и продлеваются им сами.
#
#   super-market.uz, www  — панель магазина (и API по /api/)
#   api.super-market.uz   — API для приложений
#   admin.super-market.uz — панель супер-админа
#   tg.super-market.uz    — пока перенаправление на super-market.uz

upstream super_market {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name super-market.uz www.super-market.uz;
    ssl_certificate /etc/letsencrypt/live/super-market.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/super-market.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 20m;

    location / {
        proxy_pass http://super_market;
        include /etc/nginx/snippets/super-market-proxy.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.super-market.uz;
    ssl_certificate /etc/letsencrypt/live/api.super-market.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.super-market.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 20m;

    location = / {
        return 302 https://super-market.uz/;
    }
    location / {
        proxy_pass http://super_market;
        include /etc/nginx/snippets/super-market-proxy.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.super-market.uz;
    ssl_certificate /etc/letsencrypt/live/admin.super-market.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.super-market.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 20m;

    location = / {
        return 302 /admin/;
    }
    location / {
        proxy_pass http://super_market;
        include /etc/nginx/snippets/super-market-proxy.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tg.super-market.uz;
    ssl_certificate /etc/letsencrypt/live/tg.super-market.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tg.super-market.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://super-market.uz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name super-market.uz www.super-market.uz api.super-market.uz admin.super-market.uz tg.super-market.uz;
    return 301 https://$host$request_uri;
}
